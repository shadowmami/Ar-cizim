<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="description" content="Fotoğrafı canlı kamera görüntüsü üzerine yarı saydam bindirerek kağıda çizim yapma uygulaması.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AR Çizim</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="appRoot">
    <header class="topbar">
      <h1 class="logo">AR Çizim</h1>
      <div class="topbar-actions">
        <span id="fileName" class="file-badge" hidden></span>

        <button
          type="button"
          id="torchBtn"
          class="icon-btn"
          aria-pressed="false"
          aria-label="Telefon flaşını (kağıt aydınlatmayı) aç/kapat"
          title="Flaş (Kağıt Aydınlatma)"
          hidden
        >
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
        </button>

        <button
          type="button"
          id="flipCameraBtn"
          class="icon-btn"
          aria-label="Ön ve arka kamera arasında geçiş yap"
          title="Kamerayı Çevir"
          hidden
        >
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4" />
            <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
          </svg>
        </button>

        <button
          type="button"
          id="lockBtn"
          class="lock-btn"
          aria-pressed="false"
          title="Çizim sırasında dokunmaları kilitle"
          hidden
        >
          <svg id="lockIconUnlocked" class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 9.9-1" />
          </svg>
          <svg id="lockIconLocked" class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <span id="lockBtnLabel">Kilitle</span>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <video
        id="cameraVideo"
        class="camera-video"
        autoplay
        playsinline
        muted
        hidden
      ></video>

      <div id="cameraHint" class="camera-hint" hidden>
        Çizime başlamak için bir fotoğraf yükleyin
      </div>

      <div id="gestureHint" class="gesture-hint" hidden>
        Sürükle: Taşı • İki parmak: Büyüt &amp; Döndür
      </div>

      <div class="empty-state" id="emptyState" role="button" tabindex="0" aria-label="Fotoğraf seçmek için dokunun">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="M21 15l-5-5L5 21" />
        </svg>
        <p class="empty-title">Henüz fotoğraf seçilmedi</p>
        <p class="empty-subtitle">Çizmek istediğiniz PNG veya JPG görseli yükleyin</p>
      </div>

      <div id="overlayLayer" class="overlay-layer" hidden>
        <img id="previewImage" class="preview-image" alt="Yüklenen fotoğraf önizlemesi">
        <canvas id="sketchCanvas" class="sketch-canvas" hidden></canvas>
      </div>

      <p id="errorMessage" class="error-message" role="alert" hidden></p>
    </main>

    <footer class="controls" id="controlsFooter">
      <div class="controls-inner">
        <div class="transform-bar" id="transformBar" hidden>
          <button
            type="button"
            id="sketchBtn"
            class="tool-btn tool-btn-sketch"
            aria-pressed="false"
            aria-label="Çizgisel eskiz (kontur) modunu aç/kapat"
            title="Çizgisel Eskiz Modu"
          >
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19l7-7 3 3-7 7-3-3z" />
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
              <path d="M2 2l7.586 7.586" />
            </svg>
            <span>Eskiz</span>
          </button>

          <button type="button" id="zoomOutBtn" class="tool-btn tool-btn-compact" aria-label="Küçült" title="Küçült">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
              <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
          </button>

          <button type="button" id="zoomInBtn" class="tool-btn tool-btn-compact" aria-label="Büyüt" title="Büyüt">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
              <line x1="11" y1="8" x2="11" y2="14" />
              <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
          </button>

          <button type="button" id="rotateBtn" class="tool-btn" aria-label="90 derece döndür" title="90° Döndür">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
            <span>90°</span>
          </button>

          <button type="button" id="mirrorBtn" class="tool-btn" aria-pressed="false" aria-label="Yatay çevir (ayna)" title="Yatay Çevir">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="17 1 21 5 17 9" />
              <path d="M3 11V9a4 4 0 0 1 4-4h14" />
              <polyline points="7 23 3 19 7 15" />
              <path d="M21 13v2a4 4 0 0 1-4 4H3" />
            </svg>
            <span>Ayna</span>
          </button>

          <button type="button" id="resetTransformBtn" class="tool-btn" aria-label="Konumu ve boyutu sıfırla" title="Sıfırla">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            <span>Sıfırla</span>
          </button>
        </div>

        <div class="opacity-panel" id="opacityPanel" hidden>
          <div class="slider-group">
            <div class="opacity-header">
              <label for="opacitySlider" class="opacity-label">Saydamlık</label>
              <output id="opacityValue" for="opacitySlider" class="opacity-value">%50</output>
            </div>
            <input
              type="range"
              id="opacitySlider"
              class="opacity-slider"
              min="0"
              max="100"
              step="1"
              value="50"
            >
          </div>

          <div class="slider-group slider-group-side" id="sketchDetailGroup" hidden>
            <div class="opacity-header">
              <label for="sketchDetailSlider" class="opacity-label">Çizgi Detayı</label>
              <output id="sketchDetailValue" for="sketchDetailSlider" class="opacity-value">%55</output>
            </div>
            <input
              type="range"
              id="sketchDetailSlider"
              class="opacity-slider"
              min="5"
              max="100"
              step="1"
              value="55"
            >
          </div>
        </div>

        <div class="button-row">
          <input
            type="file"
            id="imageInput"
            accept=".png,.jpg,.jpeg,image/png,image/jpeg"
            hidden
          >
          <button type="button" id="uploadBtn" class="btn btn-primary">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <span>Fotoğraf Yükle</span>
          </button>

          <button type="button" id="cameraBtn" class="btn btn-camera">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <span id="cameraBtnLabel">Kamerayı Aç</span>
          </button>

          <button
            type="button"
            id="clearBtn"
            class="btn btn-secondary btn-icon-only"
            aria-label="Fotoğrafı kaldır"
            title="Fotoğrafı Kaldır"
            hidden
          >
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
